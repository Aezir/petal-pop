<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>花漾贴贴 Petal Pop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 整个窗口就是那张桌子：背景锁死铺满（#world），工具行和左右两个面板都是浮在它上面的层，开合不挤压画面 -->
<div id="viewport">
  <!-- 桌面世界：固定 1672×941，只按窗口大小整体 cover 缩放，不平移、不跟着缩放走 -->
  <div id="world">
    <!-- 本子（画布）：wrap 是 0×0 锚点 + scale(boardZ)，贴在本子上的贴纸放在 boardLayer 里跟着一起挪、一起缩放 -->
    <div id="boardWrap" hidden>
      <img id="board" alt="board" draggable="false">
      <div id="boardLayer"></div>
    </div>

    <!-- 贴在桌面上的贴纸层：只跟窗口 fit 走，本子缩放不影响它 -->
    <div id="layer"></div>
  </div>

  <!-- 工具行：只有图标，名字走 title。功能一个不少 -->
  <div id="topbar">
    <button id="btn-side" class="btn" title="素材包面板"><i class="ri-stack-line"></i></button>
    <button id="btn-strips" class="btn" title="贴纸条面板"><i class="ri-price-tag-3-line"></i></button>
    <span class="bar-sep"></span>
    <button id="btn-bgm" class="btn" title="音乐开关"><i class="ri-music-2-line"></i></button>
    <button id="btn-board" class="btn" title="换一块底板"><i class="ri-book-2-line"></i></button>
    <button id="btn-bg" class="btn" title="换桌面"><i class="ri-landscape-line"></i></button>
    <button id="btn-skin" class="btn" title="换一套界面皮肤"><i class="ri-palette-line"></i></button>
    <span class="bar-sep"></span>
    <button id="btn-undo" class="btn" title="上一步 (Ctrl+Z)"><i class="ri-arrow-go-back-line"></i></button>
    <button id="btn-redo" class="btn" title="下一步 (Ctrl+Y)"><i class="ri-arrow-go-forward-line"></i></button>
    <button id="btn-clear" class="btn" title="全部撕掉"><i class="ri-eraser-line"></i></button>
    <span class="bar-sep"></span>
    <button id="btn-zoom-reset" class="btn zoom-btn" title="本子的缩放：滚轮以鼠标为中心放大缩小本子，桌面背景不动。点这里回到 100%"><i class="ri-search-line"></i><b id="zoom-readout">100%</b></button>
    <button id="btn-settings" class="btn" title="设置"><i class="ri-settings-3-line"></i></button>
  </div>

  <aside id="side">
    <div class="side-head">
      <span class="side-title">素材包</span>
      <button id="btn-side-toggle" class="btn icon" title="收起这个面板"><i class="ri-close-line"></i></button>
    </div>
    <div id="side-body">
      <!-- 分类：按包的内容推导——有贴纸的算「贴纸」，只有本子/桌面/音乐/皮肤的算「美化」 -->
      <div id="pack-chips" class="chips">
        <button class="chip on" data-cat="all">全部<i></i></button>
        <button class="chip" data-cat="sticker" style="--tone:var(--t3)">贴纸<i></i></button>
        <button class="chip" data-cat="deco" style="--tone:var(--t2)">美化<i></i></button>
      </div>
      <!-- 排序：点当前项 = 反向，点别的项 = 切过去并回到正向。自定义 = 拖出来的顺序 -->
      <div id="pack-sort" class="chips sort-row">
        <span class="dim sort-label">排序</span>
        <button class="chip" data-sort="manual" style="--tone:var(--t1)">自定义<i></i></button>
        <button class="chip" data-sort="name" style="--tone:var(--t1)">名称<i></i></button>
        <button class="chip" data-sort="added" style="--tone:var(--t1)">添加<i></i></button>
      </div>
      <div class="add-row">
        <input id="pack-input" placeholder="用户名/仓库名@标签  或  local:packs/xxx" spellcheck="false">
        <button id="btn-add" class="btn primary" title="从 GitHub 或本地目录安装"><i class="ri-add-line"></i></button>
      </div>
      <div id="pack-list"></div>
      <div class="side-foot">
        <button id="btn-default" class="btn" title="重装 / 更新默认包"><i class="ri-home-4-line"></i>默认包</button>
        <span class="dim side-help">只装你信得过的仓库；包里只会加载图片、音频和皮肤配置，永远不会执行脚本。</span>
      </div>
    </div>
  </aside>

  <!-- 贴纸条：一包一条，strips.js 生成 -->
  <aside id="strips"></aside>

  <!-- 拿在手上的那张贴纸：按屏幕像素画，比例跟着本子（画布）走，不跟桌面层也不跟本子层。
       必须留在 #viewport 里面：position:fixed 会自成一个层叠上下文，放外面就永远压在左栏和工具行上头了 -->
  <div id="hand"></div>

  <div id="toast" class="card"></div>
</div>

<!-- 贴纸条上的悬停提示：贴纸名 / 编号 + 包名。不用原生 title（慢、没法配色） -->
<div id="tip" hidden></div>

<!-- 撕贴纸的 WebGL 层：盖满整个窗口、按屏幕像素画，只画正在撕的那一张；不接事件 -->
<canvas id="peel"></canvas>

<!-- 设置 -->
<div id="modal" class="modal" hidden>
  <div class="card modal-card">
    <div class="modal-head">
      <span>设置</span>
      <button id="btn-close" class="btn icon" title="关闭"><i class="ri-close-line"></i></button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="skins"><i class="ri-palette-line"></i>皮肤</button>
      <button class="tab" data-tab="save"><i class="ri-save-3-line"></i>存档</button>
      <button class="tab" data-tab="storage"><i class="ri-hard-drive-2-line"></i>存储</button>
      <button class="tab" data-tab="audio"><i class="ri-music-2-line"></i>音乐</button>
    </div>

    <section data-pane="skins">
      <div id="skin-list"></div>
      <div class="dim modal-help">皮肤来自素材包里的 skin 条目，只改颜色和纹理；不加载远程字体、不执行脚本。禁用或卸载皮肤所在的包会回到默认主题，装回来自动恢复。</div>
    </section>

    <section data-pane="save" hidden>
      <p>存档里只有贴纸的位置和引用，不含图片。换电脑时导出这份文件，装上同样的素材包再导入即可复原。</p>
      <div class="btn-row">
        <button id="btn-export" class="btn"><i class="ri-download-2-line"></i>导出存档</button>
        <button id="btn-import" class="btn"><i class="ri-upload-2-line"></i>导入存档</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </section>

    <section data-pane="storage" hidden>
      <p id="storage-info" class="storage-info">…</p>
      <div class="btn-row">
        <button id="btn-gc" class="btn icon" title="删掉没有任何包引用的文件"><i class="ri-brush-2-line"></i>清理无引用文件</button>
        <button id="btn-wipe" class="btn danger" title="删除本站点所有本地数据"><i class="ri-delete-bin-2-line"></i>清空全部本地数据</button>
      </div>
      <div class="dim modal-help">素材按内容去重存在浏览器的 IndexedDB 里。卸载素材包后点“清理”可释放空间。</div>
    </section>

    <section data-pane="audio" hidden>
      <label class="slider-row">音量 <input id="volume" type="range" min="0" max="100"></label>
    </section>
  </div>
</div>

<!-- 加载 / 安装遮罩 -->
<div id="loading">
  <div class="card load-card">
    <div class="load-title">花漾贴贴</div>
    <div class="load-sub" id="load-text">启动中…</div>
    <div class="bar-wrap"><div id="bar"></div></div>
  </div>
</div>

<audio id="bgm" loop preload="none"></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
